spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:authdb-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: test-only-signing-key-at-least-32-bytes-long-for-hmac-sha256
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
