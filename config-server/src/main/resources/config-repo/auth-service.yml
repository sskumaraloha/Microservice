# Consumed by auth-service starting Step 5.
#
# The JWT signing secret itself lives in the SHARED application.yml (see
# below) because both auth-service (signs tokens) and api-gateway
# (verifies tokens) need the exact same value. Only the settings that are
# specific to *issuing* tokens belong here.

server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD:change-me-in-production}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
