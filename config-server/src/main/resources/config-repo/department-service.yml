# Consumed by department-service starting Step 7.

server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/department_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:department_service}
    password: ${DB_PASSWORD:change-me-in-production}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Step 8: calling Employee Service for live headcount statistics. Unlike
# the Feign client on the Employee Service side, this is a plain URL, not
# an Eureka service name - see WebClientConfig for why.
employee-service:
  base-url: ${EMPLOYEE_SERVICE_URL:http://employee-service:8081}
  connect-timeout-ms: 2000
  read-timeout-ms: 3000

resilience4j:
  circuitbreaker:
    instances:
      employee-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      employee-service:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  bulkhead:
    instances:
      employee-service:
        max-concurrent-calls: 10
