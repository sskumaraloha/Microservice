# Shared defaults applied to EVERY service that imports configuration from
# this Config Server, regardless of application name. Per-service files
# (e.g. employee-service.yml) can override any of these values, and
# per-service-per-profile files (e.g. employee-service-docker.yml) take
# precedence over both.
#
# `security.jwt.secret` lives here (not in auth-service.yml) because both
# auth-service (signs tokens, Step 5) and api-gateway (verifies tokens,
# Step 4) must use the exact same signing key. It is encrypted at rest —
# see docs/architecture/03-config-server.md for how {cipher} values work.

security:
  jwt:
    secret: '{cipher}63d72dc3ebe8e624aef67257d7e20dc165ce6787e11dc780659c13e66e4d4910591fe7affd1bb99824bbbee8774d0f41ef6b5550020fd723d7ee89d022c75a39f94f8bec5aae5f427b56a17009dced7cf06ef647e86e344c3597fd2a6eefda85'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# %X{traceId}/%X{spanId} are populated once Step 11 (Zipkin/OpenTelemetry)
# adds distributed tracing; until then they simply print as "-".
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka-admin}:${EUREKA_PASSWORD:change-me-in-production}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
