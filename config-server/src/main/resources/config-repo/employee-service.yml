# Consumed by employee-service starting Step 6. Kept here now so the whole
# platform's configuration is visible in one place from Step 3 onward.

server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:employee_service}
    password: ${DB_PASSWORD:change-me-in-production}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
