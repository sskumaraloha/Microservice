# Consumed by employee-service starting Step 6.

server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:employee_service}
    password: ${DB_PASSWORD:change-me-in-production}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

employee:
  documents:
    root-directory: ${EMPLOYEE_DOCUMENTS_DIR:/var/lib/ems/employee-documents}
    max-file-size-bytes: 5242880 # 5 MB
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
