spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:employeedb-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

employee:
  documents:
    root-directory: ./target/test-employee-documents-${random.uuid}
    max-file-size-bytes: 1048576
    allowed-content-types:
      - application/pdf
      - image/png

feign:
  client:
    config:
      department-service:
        connect-timeout: 1000
        read-timeout: 1000

resilience4j:
  circuitbreaker:
    instances:
      department-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 2s
  retry:
    instances:
      department-service:
        max-attempts: 3
        wait-duration: 50ms
  bulkhead:
    instances:
      department-service:
        max-concurrent-calls: 10
