spring:
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: employee-service
          uri: lb://EMPLOYEE-SERVICE
          predicates:
            - Path=/api/v1/employees/**
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: test-only-signing-key-at-least-32-bytes-long-for-hmac-sha256
    public-paths:
      - /api/v1/auth/**

gateway:
  rate-limit:
    limit-for-period: 1000
    refresh-period: 1s
  cors:
    allowed-origins:
      - http://localhost:3000
