# Local development stack for the Enterprise Employee Management System.
# This file grows one block at a time as each course step adds a service or
# a piece of infrastructure.
#
# Step 6  will add: mysql-employee
# Step 7  will add: mysql-department
# Step 9  will add: kafka, zookeeper
# Step 10 will add: redis
# Step 11 will add: zipkin
# Step 12 will add: prometheus, grafana
# Step 13 will add: elasticsearch, logstash, kibana
#
# Usage (from the repository root):
#   docker compose -f infra/docker/docker-compose.yml up --build

version: "3.9"

networks:
  ems-network:
    driver: bridge

volumes:
  mysql-auth-data:

services:
  discovery-server:
    build:
      context: ../..
      dockerfile: discovery-server/Dockerfile
    container_name: ems-discovery-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_SERVER_USERNAME: ${EUREKA_SERVER_USERNAME:-eureka-admin}
      EUREKA_SERVER_PASSWORD: ${EUREKA_SERVER_PASSWORD:-change-me-in-production}
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  config-server:
    build:
      context: ../..
      dockerfile: config-server/Dockerfile
    container_name: ems-config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-config-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-change-me-in-production}
      CONFIG_ENCRYPT_KEY: ${CONFIG_ENCRYPT_KEY:-local-development-symmetric-key-change-me}
      EUREKA_USERNAME: ${EUREKA_SERVER_USERNAME:-eureka-admin}
      EUREKA_PASSWORD: ${EUREKA_SERVER_PASSWORD:-change-me-in-production}
      EUREKA_HOST: discovery-server
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  api-gateway:
    build:
      context: ../..
      dockerfile: api-gateway/Dockerfile
    container_name: ems-api-gateway
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-config-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-change-me-in-production}
      EUREKA_USERNAME: ${EUREKA_SERVER_USERNAME:-eureka-admin}
      EUREKA_PASSWORD: ${EUREKA_SERVER_PASSWORD:-change-me-in-production}
      EUREKA_HOST: discovery-server
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mysql-auth:
    image: mysql:8.0.36
    container_name: ems-mysql-auth
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_service
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-change-me-in-production}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-change-me-in-production}
    ports:
      - "3307:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${AUTH_DB_ROOT_PASSWORD:-change-me-in-production}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: ../..
      dockerfile: auth-service/Dockerfile
    container_name: ems-auth-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-config-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-change-me-in-production}
      EUREKA_USERNAME: ${EUREKA_SERVER_USERNAME:-eureka-admin}
      EUREKA_PASSWORD: ${EUREKA_SERVER_PASSWORD:-change-me-in-production}
      EUREKA_HOST: discovery-server
      DB_HOST: mysql-auth
      DB_USERNAME: auth_service
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-change-me-in-production}
    depends_on:
      config-server:
        condition: service_healthy
      mysql-auth:
        condition: service_healthy
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
