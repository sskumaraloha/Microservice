spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:departmentdb-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

employee-service:
  connect-timeout-ms: 1000
  read-timeout-ms: 1000

resilience4j:
  circuitbreaker:
    instances:
      employee-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 2s
  retry:
    instances:
      employee-service:
        max-attempts: 3
        wait-duration: 50ms
  bulkhead:
    instances:
      employee-service:
        max-concurrent-calls: 10
